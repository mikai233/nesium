[workspace]
resolver = "3"
members = [
  "apps/nesium-egui",
  "crates/nesium-core",
  "crates/libretro-bridge",
  "crates/nesium-libretro",
  "crates/nesium-flutter",
  "crates/nesium-blip",
  "crates/nesium-icon",
  "crates/nesium-runtime",
  "crates/nesium-wasm",
  "crates/nesium-netplay",
  "crates/nesium-netd",
  "crates/nesium-netproto",
  "crates/nesium-support",
]

[profile.test]
opt-level = 2
debug = true

[profile.release]
opt-level = 3
panic = "abort"
debug = false

# Workaround for rustc crash (0xc000001d) when cross-compiling rand_chacha 0.9.0
# for Android x86_64 on Windows hosts at opt-level 3.
[profile.release.package.rand_chacha]
opt-level = 2

[profile.release-dist]
inherits = "release"
codegen-units = 1
lto = "fat"
strip = "symbols"

[workspace.package]
license = "GPL-3.0-or-later"
description = "Nesium - a cross-platform NES emulator"
repository = "https://github.com/mikai233/nesium"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.dependencies]
libretro-bridge = { path = "crates/libretro-bridge" }
nesium-blip = { path = "crates/nesium-blip" }
nesium-core = { path = "crates/nesium-core" }
nesium-support = { path = "crates/nesium-support" }
nesium-icon = { path = "crates/nesium-icon" }
nesium-runtime = { path = "crates/nesium-runtime" }
nesium-netd = { path = "crates/nesium-netd" }
nesium-netplay = { path = "crates/nesium-netplay" }
nesium-netproto = { path = "crates/nesium-netproto" }

bitflags = "2.13.2"
rand = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
ctor = "1.0.13"
dyn-clone = "1.0.20"
crc32fast = "1.5.2"
phf = "0.14.0"
phf_codegen = "0.14.0"
eframe = "0.36.2"
flutter_rust_bridge = "=2.13.0"
gilrs = "0.11.2"
once_cell = "1.21"
bindgen = "0.73.2"
ureq = "3.4.2"
serde = "1.0.229"
postcard = "1.1.3"
anyhow = "1.0.104"
rfd = "0.17.2"
cpal = "0.18.2"
ringbuf = "0.5.2"
base64 = "0.23.1"
sha1 = "0.11.0"
skia-safe = "0.153.3"
ico = "0.5.0"
winres = "0.1.12"
png = "0.18.1"
cc = "1.4.7"
proptest = "1.11.0"
clap = "4.6.7"
tokio = "1.53.1"
thiserror = "2.0.20"
strum = "0.28.0"
bytes = "1.12.1"
jni = "0.22.4"
ndk-context = "0.1.1"
libc = "0.2.189"
crossbeam-channel = "0.5.17"
lz4_flex = "0.14.0"
wasm-bindgen = "0.2.128"
console_error_panic_hook = "0.1.7"
mimalloc = "0.1.52"
dashmap = "6.2.1"
hex = "0.4.3"
quinn = { version = "0.11.12", default-features = false, features = [
  "runtime-tokio",
  "rustls-ring",
] }
rustls = { version = "0.23.45", default-features = false, features = [
  "std",
  "ring",
  "tls12",
] }
rustls-native-certs = "0.8.4"
ring = "0.17.14"
rcgen = { version = "0.14.10", default-features = false, features = [
  "pem",
  "ring",
] }
parking_lot = "0.12.5"
xbrz-rs = "0.1.0"
librashader = { version = "0.12.0", default-features = false }
arc-swap = "1.9.2"
